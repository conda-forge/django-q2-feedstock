schema_version: 1

context:
  name: django-q2
  version: "1.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_q2-${{ version }}.tar.gz
  sha256: 640caf961f9098f26e00a22b743c4eb63da681a5390829b1ed951db677866e67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.10.7,<=0.12.1
    - pip
  run:
    - python >=${{ python_min }}
    - django >=5.2
    - django-picklefield >=3.1.0,<4.0.0

tests:
  - python:
      imports:
        - django_q
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A multiprocessing distributed task queue for Django
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/django-q2/django-q2
  documentation: https://django-q2.readthedocs.org

extra:
  recipe-maintainers:
    - thewchan
